<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sahayak · Paytm for Business</title>
<style>
:root {
  --paytm-blue: #00BAF2;
  --paytm-dark: #002970;
  --bg: #f0f4f8;
  --white: #ffffff;
  --fg: #1a1a2e;
  --muted: #6b7280;
  --border: #e5e7eb;
  --bubble-ai: #ffffff;
  --bubble-user: #00BAF2;
  --success: #10b981;
  --tab-inactive: #9ca3af;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Phone frame */
.phone {
  width: 100%;
  max-width: 420px;
  height: 100vh;
  max-height: 820px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  box-shadow: 0 0 60px rgba(0,186,242,0.15);
}
@media (min-width: 500px) {
  .phone { border-radius: 32px; height: 92vh; }
}

/* Status bar */
.status-bar {
  background: var(--paytm-dark);
  color: white;
  font-size: 11px;
  padding: 6px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.status-bar .time { font-weight: 600; }
.status-bar .icons { display: flex; gap: 6px; font-size: 12px; }

/* App header */
.app-header {
  background: linear-gradient(135deg, var(--paytm-dark), #003d99);
  color: white;
  padding: 12px 16px 10px;
}
.app-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.app-logo {
  display: flex;
  align-items: center;
  gap: 8px;
}
.app-logo .logo-text {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.app-logo .badge {
  font-size: 10px;
  background: rgba(255,255,255,0.2);
  padding: 2px 8px;
  border-radius: 10px;
}
.app-header .shop-name {
  font-size: 12px;
  opacity: 0.8;
}

/* App tabs */
.app-tabs {
  display: flex;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 3px;
}
.app-tab {
  flex: 1;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 4px;
  border-radius: 8px;
  cursor: pointer;
  color: rgba(255,255,255,0.6);
  transition: all 0.2s;
  border: none;
  background: none;
}
.app-tab.active {
  background: var(--paytm-blue);
  color: white;
}

/* Chat area */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 12px 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

/* Soundbox indicator */
.soundbox-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #e8f8fe;
  border: 1px solid #b3e8fb;
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--paytm-dark);
  animation: fadeIn 0.3s ease;
}
.soundbox-bar .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success);
  animation: blink 2s infinite;
}

/* Chat bubbles */
.bubble {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.45;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.bubble.ai {
  background: var(--bubble-ai);
  color: var(--fg);
  border-bottom-left-radius: 4px;
  align-self: flex-start;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
.bubble.user {
  background: var(--bubble-user);
  color: white;
  border-bottom-right-radius: 4px;
  align-self: flex-end;
}
.bubble .label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
  color: var(--paytm-blue);
}
.bubble.user .label { color: rgba(255,255,255,0.7); }
.bubble .source-tag {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
  font-style: italic;
}

/* Action buttons */
.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.action-btn {
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid var(--paytm-blue);
  border-radius: 20px;
  padding: 7px 16px;
  background: var(--paytm-blue);
  color: white;
  transition: all 0.2s;
}
.action-btn:hover { background: var(--paytm-dark); border-color: var(--paytm-dark); }
.action-btn.ghost { background: transparent; color: var(--paytm-blue); }
.action-btn.ghost:hover { background: var(--paytm-blue); color: white; }
.action-btn:disabled { opacity: 0.4; cursor: default; }

.budget-row {
  display: flex; gap: 6px; align-items: center; margin-top: 6px;
}
.budget-row input {
  font: inherit; font-size: 13px;
  border: 2px solid var(--border); border-radius: 10px;
  padding: 6px 10px; width: 100px;
  background: var(--bg); color: var(--fg);
}
.budget-row input:focus { border-color: var(--paytm-blue); outline: none; }

/* Measure card */
.measure-card {
  background: var(--white);
  border-radius: 14px;
  padding: 12px 14px;
  max-width: 82%;
  align-self: flex-start;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  animation: fadeIn 0.3s ease;
  border-left: 3px solid var(--success);
}
.measure-card h3 { font-size: 13px; color: var(--success); font-weight: 700; margin-bottom: 6px; }
.measure-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
.measure-row .val { font-weight: 700; }

/* Suggestion chips */
.chips {
  display: flex; flex-wrap: wrap; gap: 6px;
  max-width: 88%; align-self: flex-start;
  animation: fadeIn 0.3s ease;
}
.chip {
  font: inherit; font-size: 12px;
  cursor: pointer;
  border: 1.5px solid var(--paytm-blue);
  border-radius: 16px;
  padding: 5px 12px;
  background: var(--white);
  color: var(--paytm-blue);
  transition: all 0.2s;
}
.chip:hover { background: var(--paytm-blue); color: white; }

/* Input bar */
.input-bar {
  background: var(--white);
  border-top: 1px solid var(--border);
  padding: 8px 12px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.input-bar select {
  font: inherit; font-size: 11px;
  border: 1px solid var(--border); border-radius: 16px;
  padding: 6px 8px; background: var(--bg); color: var(--fg); cursor: pointer;
}
.input-bar input {
  flex: 1; font: inherit; font-size: 14px;
  border: 2px solid var(--border); border-radius: 20px;
  padding: 8px 14px; background: var(--bg); color: var(--fg);
}
.input-bar input:focus { border-color: var(--paytm-blue); outline: none; }
.mic-btn, .send-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: none; background: var(--paytm-blue); color: white;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.2s;
}
.mic-btn:hover, .send-btn:hover { background: var(--paytm-dark); }
.mic-btn.listening { background: #ef4444; animation: pulse 1s infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
  50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
}

/* Bottom nav */
.bottom-nav {
  background: var(--white);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 6px 0 10px;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  color: var(--tab-inactive);
  cursor: pointer;
  border: none;
  background: none;
  padding: 4px 0;
}
.nav-item.active { color: var(--paytm-blue); }
.nav-item .nav-icon { font-size: 18px; }
.nav-item .nav-label { font-weight: 600; }

/* Typing */
.typing { display: flex; gap: 3px; padding: 6px 14px; }
.typing span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted); opacity: 0.4;
  animation: blink 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

.footer-note {
  text-align: center; font-size: 9px;
  color: var(--muted); padding: 4px; background: var(--bg);
}

[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="phone">
  <!-- Status bar -->
  <div class="status-bar">
    <span class="time" id="clock">12:30</span>
    <span class="icons">📶 🔋</span>
  </div>

  <!-- App header -->
  <div class="app-header">
    <div class="app-header-top">
      <div class="app-logo">
        <span class="logo-text">Paytm Business</span>
        <span class="badge">for Merchants</span>
      </div>
    </div>
    <div class="app-tabs">
      <button class="app-tab" onclick="switchTab('home')">🏠 Home</button>
      <button class="app-tab" onclick="switchTab('payments')">💳 Payments</button>
      <button class="app-tab active" id="tab-sahayak" onclick="switchTab('sahayak')">🤖 Sahayak</button>
      <button class="app-tab" onclick="switchTab('account')">👤 Account</button>
    </div>
  </div>

  <!-- Soundbox connection indicator -->
  <div class="soundbox-bar">
    <span class="dot"></span>
    <span>🔊 Soundbox connected · Voice active · Will speak insights aloud</span>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chat"></div>

  <!-- Input bar -->
  <div class="input-bar">
    <select id="lang"><option value="en-IN">EN</option><option value="hi-IN">HI</option></select>
    <input id="q" type="text" placeholder="Ask Sahayak..." aria-label="Your question">
    <button class="mic-btn" id="mic" title="Voice">🎤</button>
    <button class="send-btn" id="send" title="Send">➤</button>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <button class="nav-item" onclick="switchTab('home')"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></button>
    <button class="nav-item" onclick="switchTab('payments')"><span class="nav-icon">💳</span><span class="nav-label">Payments</span></button>
    <button class="nav-item active" id="nav-sahayak"><span class="nav-icon">🤖</span><span class="nav-label">Sahayak</span></button>
    <button class="nav-item" onclick="switchTab('account')"><span class="nav-icon">👤</span><span class="nav-label">Account</span></button>
  </div>

  <div class="footer-note">
    Prototype · Synthetic data · Not affiliated with Paytm · <a href="/docs" style="color:var(--paytm-blue)">API</a>
  </div>
</div>

<script>
const API = "";
const inr = new Intl.NumberFormat("en-IN");
const chat = document.getElementById("chat");
let S = {};

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.getHours().toString().padStart(2, "0") + ":" + now.getMinutes().toString().padStart(2, "0");
}
updateClock(); setInterval(updateClock, 30000);

function switchTab(t) {
  if (t !== "sahayak") {
    alert("This is a prototype — only the Sahayak tab is active.");
  }
}

function hourLabel(h) { return (h % 12 || 12) + (h >= 12 ? " pm" : " am"); }

function addBubble(text, type, extra) {
  const div = document.createElement("div");
  if (type === "ai") {
    div.className = "bubble ai";
    div.innerHTML = (extra ? `<div class="label">${extra}</div>` : "") + text;
  } else if (type === "user") {
    div.className = "bubble user";
    div.innerHTML = `<div class="label">You</div>` + text;
  } else if (type === "measure") {
    div.className = "measure-card";
    div.innerHTML = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addChips(chips) {
  const div = document.createElement("div");
  div.className = "chips";
  chips.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = c;
    btn.onclick = () => { div.remove(); askQuestion(c); };
    div.appendChild(btn);
  });
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "bubble ai"; div.id = "typing";
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() { const el = document.getElementById("typing"); if (el) el.remove(); }

// ---- Fetch real data and start ----
async function init() {
  try {
    const res = await fetch(API + "/api/status");
    S = await res.json();
  } catch (e) {
    addBubble("Server not connected. Run start.bat first.", "ai", "Sahayak");
    return;
  }
  startConversation();
}

function startConversation() {
  const day = S.weak_weekday || "Thursday";
  const pct = S.drop_pct || 15;

  setTimeout(() => {
    addBubble("Namaste Sunita ji! 🙏 Main aapka Sahayak hoon — aapke Soundbox se juda.", "ai", "Sahayak");
    setTimeout(() => {
      addBubble(
        `Aapki <strong>${day}</strong> ki sales mein <strong>${pct}%</strong> ki giravat aayi hai pichhle 3 hafton mein.` +
        `<div class="source-tag">📊 trend.py → weekday comparison from Paytm transactions</div>`, "ai"
      );
      setTimeout(() => {
        addBubble(
          S.explanation +
          `<div class="source-tag">📊 explainer.py → plain-language insight</div>`, "ai"
        );
        setTimeout(() => {
          if (S.peak_hours && S.peak_hours.length >= 2) {
            addBubble(
              `Sabse zyada business: <strong>${hourLabel(S.peak_hours[0][0])}</strong> (₹${inr.format(S.peak_hours[0][1])}) aur <strong>${hourLabel(S.peak_hours[1][0])}</strong> (₹${inr.format(S.peak_hours[1][1])}).` +
              `<div class="source-tag">📊 SQLite → top hours by SUM(amount)</div>`, "ai"
            );
          }
          setTimeout(() => showSuggestion(), 700);
        }, 700);
      }, 900);
    }, 900);
  }, 400);
}

function showSuggestion() {
  addBubble(
    `💡 <strong>${S.suggestion}</strong><br><br>Bina aapki ijazat ke kuch nahi hoga.` +
    `<div class="source-tag">📊 planner.py → capped experiment</div>` +
    `<div class="action-row">` +
    `<button class="action-btn" onclick="decide('approve')">✅ Haan</button>` +
    `<button class="action-btn ghost" onclick="showBudgetChange()">💰 Budget</button>` +
    `<button class="action-btn ghost" onclick="decide('skip')">Nahi</button>` +
    `</div>` +
    `<div class="budget-row" id="budget-row" hidden>` +
    `<input type="number" id="cap-input" min="100" max="${S.max_cap||1500}" step="100" value="${S.cap}" placeholder="₹">` +
    `<button class="action-btn" onclick="applyBudget()">Set</button>` +
    `</div>`, "ai", "Your decision"
  );
  setTimeout(() => {
    addChips([
      `Why are ${S.weak_weekday||'Thursday'} sales down?`,
      "Sabse busy time kab hai?",
      "Kya try karun?",
      "Aaj kitna kamaya?"
    ]);
  }, 500);
}

window.showBudgetChange = function() {
  document.getElementById("budget-row").hidden = false;
  document.getElementById("cap-input").focus();
};
window.applyBudget = function() {
  const v = Number(document.getElementById("cap-input").value);
  if (!v || v < 100) return alert("Min ₹100");
  if (v > (S.max_cap||1500)) return alert(`Max ₹${inr.format(S.max_cap||1500)}`);
  S.cap = v;
  decide("change");
};

window.decide = async function(d) {
  document.querySelectorAll(".action-btn").forEach(b => b.disabled = true);
  const br = document.getElementById("budget-row"); if (br) br.remove();

  if (d === "skip") {
    addBubble("Nahi, abhi nahi.", "user");
    fetch(API+"/api/decision",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({decision:"skip"})}).catch(()=>{});
    S.decision = "skipped";
    setTimeout(()=> addBubble("Koi baat nahi! Main data dekhta rahunga. Jab zaroorat ho, pooch lena. 👍","ai","Sahayak"), 500);
  } else {
    const cap = d==="change" ? S.cap : (S.cap||1000);
    addBubble(d==="change" ? `Haan, ₹${inr.format(cap)} budget se chalao` : "Haan, chalao! 👍","user");
    try {
      const res = await fetch(API+"/api/decision",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({decision:d==="change"?"change":"approve",cap:d==="change"?cap:null})});
      const data = await res.json();
      S.decision = data.decision; S.cap = data.cap;
    } catch(e){}
    setTimeout(()=>{
      addBubble("Chaliye! Test shuru ho gaya. 3 hafton mein result bataunga. ✅","ai","Sahayak");
      setTimeout(()=> fetchMeasure(), 1000);
    }, 500);
  }
};

async function fetchMeasure() {
  try {
    const res = await fetch(API+"/api/status");
    const data = await res.json();
    if (data.measure) {
      const m = data.measure;
      const sign = m.change_pct >= 0 ? "+" : "";
      addBubble(
        `<h3>📈 Test Result</h3>`+
        `<div class="measure-row"><span>${S.weak_weekday||'Thursday'} avg (test)</span><span class="val">₹${inr.format(m.test_avg)}</span></div>`+
        `<div class="measure-row"><span>${S.weak_weekday||'Thursday'} avg (before)</span><span class="val">₹${inr.format(m.baseline_avg)}</span></div>`+
        `<div class="measure-row"><span>Change</span><span class="val" style="color:${m.change_pct>=0?'var(--success)':'#ef4444'}">${sign}${m.change_pct}%</span></div>`+
        `<div class="source-tag">📊 planner.py → measure() from DB</div>`, "measure"
      );
      setTimeout(()=> addBubble(`${m.change_pct>=0?'Badhai ho':'Hmm'}! ${S.weak_weekday||'Thursday'} sales mein <strong>${sign}${m.change_pct}%</strong> ka change aaya. ${m.note}`,"ai","Sahayak"), 700);
    } else {
      addBubble("Test period complete hone par result bataunga.","ai","Sahayak");
    }
  } catch(e){ addBubble("Result baad mein check karna.","ai","Sahayak"); }
}

// ---- Q&A ----
async function askQuestion(text) {
  if (!text.trim()) return;
  addBubble(text, "user");
  document.getElementById("q").value = "";
  showTyping();
  try {
    const res = await fetch(API+"/api/ask-text",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:text})});
    const data = await res.json();
    hideTyping();
    addBubble(data.answer+`<div class="source-tag">🤖 Groq LLM (Llama 3.1 70B) + shop data</div>`,"ai","Sahayak");
    speakText(data.answer);
  } catch(e){
    hideTyping();
    addBubble("Server se connect nahi ho paya.","ai","Sahayak");
  }
}

function speakText(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = document.getElementById("lang").value;
    speechSynthesis.speak(u);
  } catch(e){}
}

// ---- Voice ----
(function setupVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById("mic");
  if (!SR) { mic.title = "Voice needs Chrome/Edge"; return; }
  const rec = new SR();
  rec.continuous = false; rec.interimResults = false;
  rec.onresult = (e) => { askQuestion(e.results[0][0].transcript); };
  rec.onerror = rec.onend = () => { mic.className="mic-btn"; mic.textContent="🎤"; };
  mic.onclick = () => {
    rec.lang = document.getElementById("lang").value;
    mic.className="mic-btn listening"; mic.textContent="⏺";
    try { rec.start(); } catch(e){}
  };
})();

document.getElementById("send").onclick = () => askQuestion(document.getElementById("q").value);
document.getElementById("q").onkeydown = (e) => { if(e.key==="Enter") askQuestion(document.getElementById("q").value); };
init();
</script>
</body>
</html>
